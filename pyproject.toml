[project]
name = "crypto-data-engineering"
version = "0.1.0"
description = "Production-grade ELT pipeline for crypto market data with a point-in-time-correct feature store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.14",
    "cryptography>=48.0.0",
    "dbt-athena-community>=1.10.1",
    "httpx>=0.27.0",
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyathena>=3.31.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Only the pure-Python unit tests; airflow/tests need the Astro runtime image.
# pythonpath puts the repo root on sys.path so `ml`/`ingestion` import the same
# way they do under `uv run python -m ...`.
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# Third-party libs without bundled type stubs. boto3 famously ships no stubs
# (the official path is the boto3-stubs package, which is heavy); pyarrow's
# stubs are partial. Silence missing-import noise from these only.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore",
    "botocore.*",
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "pandas.*",
    "pyathena",
    "pyathena.*",
    "sklearn",
    "sklearn.*",
    "lightgbm",
    "lightgbm.*",
]
ignore_missing_imports = true
