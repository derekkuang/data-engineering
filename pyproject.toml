[project]
name = "crypto-data-engineering"
version = "0.1.0"
description = "Production-grade ELT pipeline for crypto market data with a point-in-time-correct feature store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.14",
    "dbt-athena-community>=1.10.1",
    "httpx>=0.27.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyathena>=3.31.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# Third-party libs without bundled type stubs. boto3 famously ships no stubs
# (the official path is the boto3-stubs package, which is heavy); pyarrow's
# stubs are partial. Silence missing-import noise from these only.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore",
    "botocore.*",
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "pandas.*",
    "pyathena",
    "pyathena.*",
]
ignore_missing_imports = true
