name: ws in-play capture

# Auto-logger for the toxicity / ML feature store. At game-heavy windows this captures the
# live in-play microstructure of the active sports board (ml.lp.ws_features — book shape, flow,
# mid vol/drift, per market every few seconds) and lands it to the S3 raw zone
# (ingestion.ws_feature_storage). The nightly `scheduled pipeline` then builds stg_ws_features
# + fct_ws_markout (the markout-labeled table) over it.
#
# The schedule is a COARSE fixed net over global game clusters (Europe evening, US afternoon,
# US evening) — a fixed-cron trade-off vs a standing daemon; tune the crons / add dispatch runs
# for specific games. GitHub Actions runs scheduled workflows only on the default branch.
# Read-only: it places no orders and needs no trading key.

on:
  schedule:
    - cron: "0 19 * * *"   # ~afternoon Europe / midday US        -> --wide (controls + Euro board)
    - cron: "0 23 * * *"   # ~evening Europe / afternoon US        -> --wide (controls + US board)
    - cron: "0 0 * * *"    # ~prime Americas club-soccer kickoff   -> SOCCER-only capture
    - cron: "0 2 * * *"    # ~late Americas club soccer            -> SOCCER-only capture
  workflow_dispatch:
    inputs:
      minutes:
        description: "capture minutes"
        default: "90"
      prefix:
        description: "restrict to a series prefix (e.g. KXWC); blank = whole active sports board"
        default: ""

permissions:
  id-token: write   # OIDC federation into the CI role
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under the 6h job cap; the capture itself is bounded by --minutes
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: derekkuang-crypto-de-raw-546712138633-us-east-1-an
      KALSHI_API_BASE: https://external-api.kalshi.com/trade-api/v2
      # Kalshi's WS requires auth even for market data (ws_handshake refuses without a key).
      # Set these two REPO SECRETS: KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY (the PEM contents —
      # the client loads an inline PEM from this env var). NOTE: Kalshi keys are full-account
      # (no read-only scope) — see docs/setup/09 for the risk note before adding them.
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      CAPTURE_MINUTES: ${{ inputs.minutes || '90' }}
      CAPTURE_PREFIX: ${{ inputs.prefix || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::546712138633:role/crypto-de-ci
          aws-region: us-east-1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Capture in-play microstructure
        # --wide = the MEASUREMENT universe (keeps known-toxic ITF/MATCH/GAME as labeled markout
        # controls). The two Americas-evening windows instead capture SOCCER-ONLY (--prefix soccer):
        # frequent-scoring MLB/tennis out-trade sparse soccer and crowd it out of the cap=40 under
        # --wide (the review's flag + the measured "soccer stuck at 5-7 capture days"), so a
        # soccer-prefixed window is the only way the hypothesis families reliably accumulate days.
        # Controls stay in the two --wide windows. The maker's TRADING gate is unchanged; only
        # capture is retargeted. Prefix is chosen by which cron fired (github.event.schedule).
        run: |
          SOCCER="KXMLS,KXLIGAMX,KXBRASILEIRO,KXCOPADOBRASIL,KXALLSVENSKAN,KXELITESERIEN,KXDENSUPERLIGA,KXEPL,KXLALIGA,KXSERIEA,KXBUNDESLIGA,KXLIGUE1,KXUCL,KXUEL,KXEREDIVISIE,KXEFLCHAMPIONSHIP,KXSAUDIPL"
          PREFIX="$CAPTURE_PREFIX"
          case "${{ github.event.schedule }}" in
            "0 0 * * *"|"0 2 * * *") PREFIX="$SOCCER" ;;
          esac
          if [ -n "$PREFIX" ]; then
            uv run python -m ml.lp.ws_features --minutes "$CAPTURE_MINUTES" --wide --prefix "$PREFIX"
          else
            uv run python -m ml.lp.ws_features --minutes "$CAPTURE_MINUTES" --wide
          fi

      # The capture step outlives the 1-hour OIDC session (90+ min), so the job-start
      # credentials are EXPIRED by the time we upload. Re-exchange the OIDC token for a
      # fresh session right before landing — robust for any --minutes value.
      # if: always() — if the capture step ERRORS midway (WS drop, Kalshi hiccup), still refresh
      # creds and land whatever partial CSV was written, rather than losing the window's data.
      - name: Refresh AWS credentials (capture outlives the 1h OIDC session)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::546712138633:role/crypto-de-ci
          aws-region: us-east-1

      - name: Land features to the S3 raw zone
        if: always()
        run: uv run python -m ingestion.ws_feature_storage
