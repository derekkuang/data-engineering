name: dbt CI

# Runs `dbt build` (compile -> run -> test, including the point-in-time
# correctness singular test) against Athena on every push and pull request.
#
# AWS auth is via GitHub OIDC federation into a scoped IAM role -- NO long-lived
# AWS keys are stored in GitHub. One-time AWS setup: docs/setup/04-github-oidc-ci.md
#
# This is data CI: a green check means every model still compiles, materializes,
# and passes its schema + PIT tests against the real warehouse.

on:
  push:
  pull_request:

# id-token: write is required for the OIDC token exchange; contents: read for checkout.
permissions:
  id-token: write
  contents: read

concurrency:
  # The marts are incremental Iceberg tables; a row-level MERGE isn't safe to run
  # concurrently against the same table, so serialize CI runs per git ref.
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ATHENA_WORKGROUP: crypto_wg
      ATHENA_S3_STAGING_DIR: s3://derekkuang-crypto-de-raw-546712138633-us-east-1-an/athena-results/
      # profiles.yml lives in dbt/ and reads the env vars above.
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::546712138633:role/crypto-de-ci
          aws-region: us-east-1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build (run + test, incl. PIT correctness test)
        working-directory: dbt
        run: uv run dbt build
