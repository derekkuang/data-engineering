version: 2

models:
  - name: fct_toxicity_by_family
    description: >
      The toxicity scoreboard: per (sport, market_type, capture day), two adverse-selection axes
      from the WS in-play capture. (1) avg_flow_markout_c — the flow-signed markout over
      FLOW-BEARING snapshots only (signed_flow_1m != 0); >0 = taker flow led price = toxic, but
      BLIND to flowless jumps. (2) avg_jump_pickoff_c — flow-INDEPENDENT jump toxicity over ALL
      snapshots (max(0,|fwd move|-half spread)); the goal/point pick-off the flow axis can't see.
      The day grain feeds core/maker/edge_verdict.py's day-block bootstrap. ITF / MLB-GAME rows are
      deliberate known-toxic controls: they must read high on the JUMP axis even if flow reads
      benign (the instrument check).
    columns:
      - name: sport
        tests:
          - not_null
      - name: market_type
        tests:
          - not_null
      - name: breadth
        description: >
          SINGLE_NAME (a named team/player's outcome) vs BROAD (aggregate over/under), coarsened
          from market_type. Per Bartlett & O'Hara (2026), flow-signed-markout toxicity has power
          only for SINGLE_NAME; a one-sided flow reading on a BROAD family is not toxicity evidence.
        tests:
          - not_null
      - name: capture_day
        tests:
          - not_null
      - name: n_flow_obs
        description: "Flow-bearing snapshots — the sample size for the flow-markout verdict."
        tests:
          - not_null
      - name: avg_jump_pickoff_c
        description: "Flow-independent jump toxicity (cents) over all snapshots; goal/point pick-off."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sport
              - market_type
              - capture_day
