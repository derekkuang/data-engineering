version: 2

models:
  - name: int_kalshi_implied_prob
    description: >
      Per wall-clock minute, the active KXBTC15M market's implied probability of an
      up move (plus mid/spread/bid/ask). Point-in-time-safe: the value is the market
      price AT that minute. Joined into fct_features_pit as a BTC feature.
    columns:
      - name: event_at
        description: "Wall-clock minute, UTC. One row per minute."
        tests:
          - not_null
          - unique
      - name: kalshi_implied_prob
        description: "Active market's implied P(up) at this minute (0..1)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: kalshi_spread
        description: "Active market's yes_ask - yes_bid (trading cost) at this minute."
