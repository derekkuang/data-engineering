version: 2

sources:
  - name: kalshi
    description: >
      Raw Kalshi KXBTC15M ("BTC price up in next 15 mins?") candlesticks landed in
      the S3 raw zone by the Python ingestion (backfill + the live 15-min Airflow
      task) and exposed via a Glue external table with partition projection on dt.
    database: awsdatacatalog   # Athena catalog
    schema: crypto_raw         # Glue database holding the external table
    tables:
      - name: kalshi_btc_15min
        description: >
          One row per (market, 1-minute candlestick). The market price (dollars,
          0..1) is the implied probability of an up move over that 15-min window;
          yes_bid/yes_ask give the trading spread; result is the settlement outcome.
        columns:
          - name: market_ticker
            description: "The 15-min market, e.g. KXBTC15M-26JUN011745-45."
          - name: series_ticker
            description: "Series, always KXBTC15M here."
          - name: window_open_at
            description: "Start of the 15-min window, UTC."
          - name: window_close_at
            description: "End of the 15-min window, UTC (settlement reference)."
          - name: event_at
            description: "Candlestick end timestamp (the 1-min bar), UTC."
          - name: implied_prob_close
            description: "Market price at bar close (0..1) = implied P(up over window)."
          - name: implied_prob_mean
            description: "Mean market price across the 1-min bar."
          - name: yes_bid_close
            description: "Best YES bid at bar close (0..1)."
          - name: yes_ask_close
            description: "Best YES ask at bar close (0..1)."
          - name: volume
            description: "Contracts traded during the bar."
          - name: open_interest
            description: "Open interest as of the bar."
          - name: result
            description: "Settlement: 'yes' (up) / 'no' (down) / '' if not yet settled. FORWARD-LOOKING."
          - name: ingested_at
            description: "Wall-clock UTC time the ingestion wrote this row."
          - name: dt
            description: "Partition key (YYYY-MM-DD), the window's open date, from the S3 path."
