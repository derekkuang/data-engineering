version: 2

models:
  - name: stg_kalshi_btc_15min
    description: >
      Cleaned candle-level Kalshi KXBTC15M data: one row per (market_ticker,
      event_at), with implied probability, bid/ask, derived mid + spread, and the
      window's settlement result. A view over the raw external table.
    columns:
      - name: market_ticker
        description: "The 15-min market, e.g. KXBTC15M-26JUN011745-45."
        tests:
          - not_null
      - name: window_open_at
        description: "Start of the 15-min window, UTC."
        tests:
          - not_null
      - name: window_close_at
        description: "End of the 15-min window, UTC."
        tests:
          - not_null
      - name: event_at
        description: "Candlestick (1-min bar) end timestamp, UTC."
        tests:
          - not_null
      - name: implied_prob
        description: "Market price at bar close (0..1) = implied P(up over window)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: mid_price
        description: "(yes_bid + yes_ask) / 2."
      - name: spread
        description: "yes_ask - yes_bid = the trading cost (in dollars, 0..1)."
      - name: result
        description: "Settlement: 'yes' (up) / 'no' (down) / '' if unsettled. FORWARD-LOOKING — label only."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_ticker
              - event_at

  - name: stg_kalshi_universe
    description: >
      Cleaned universe snapshot: one row per (market_ticker, snapshot_at) for every open
      market with a two-sided quote + real 24h volume, with derived mid/spread and the
      near-money / retail-spread-band flags. A view over the raw external table.
    columns:
      - name: market_ticker
        description: "The open market, e.g. KXWCSPREAD-26JUL15ABC-A."
        tests:
          - not_null
      - name: snapshot_at
        description: "UTC capture time."
        tests:
          - not_null
      - name: series_ticker
        description: "The market's series."
        tests:
          - not_null
      - name: spread
        description: "yes_ask - yes_bid = the maker's gross per-round-trip prize (dollars)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_near_money
        description: "Boolean: mid in [0.15, 0.85] (a real two-sided quote, not a settled tail)."
      - name: in_retail_band
        description: "Boolean: spread in 2-15c (the retail band the soccer MM edge lives in)."
      - name: has_maker_fee
        description: "Boolean: series fee_type = 'quadratic_with_maker_fees'."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_ticker
              - snapshot_at
